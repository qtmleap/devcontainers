name: Integration
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Meta-CI for the devcontainer template repo. Every pull request runs each
# example's integration checks (lint / typecheck / build / test) against the
# current template state, so a regression in any example surfaces on the PR.
# These checks report; they do not gate. The repository has no branch
# protection, so nothing here prevents a bad commit from landing on its own.
#
# Structure per stack:
#   - Node/Bun (hono-*, vinext, prisma monorepo) → biome check + tsc + bun test
#   - Python (uv)                                 → ruff + mypy + pytest
#   - Rust                                        → fmt + clippy + test
#   - Swift on Linux                              → swift build + test + swift-format

jobs:
  commitlint:
    name: Commit Lint
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-commitlint
      - name: Install commitlint
        run: |
          bun install conventional-changelog-conventionalcommits
          bun install @commitlint/config-conventional@latest
          bun install commitlint@latest
      # Commits are linted on pull_request only. A workflow_dispatch run has no
      # pull_request context to derive --from/--to from, so this job installs
      # commitlint and passes without validating anything.
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ============================================================================
  # Node / Bun examples
  # ============================================================================

  node-examples:
    name: Verify ${{ matrix.example }}
    runs-on: [self-hosted, docker]
    strategy:
      fail-fast: false
      matrix:
        example:
          - hono-node
          - hono-workers
          - hono-vite-react-node
          - hono-vite-react-workers
          - vinext
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.example }}-${{ hashFiles(format('examples/{0}/package.json', matrix.example)) }}
          restore-keys: |
            bun-${{ runner.os }}-${{ matrix.example }}-
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Biome check
        run: bunx --bun biome check
      - name: TypeScript check
        run: bun run typecheck
      - name: Run tests
        run: bun test

  # Prisma monorepo has its own multi-workspace structure — verify separately.
  hono-vite-react-workers-prisma:
    name: Verify hono-vite-react-workers-prisma
    runs-on: [self-hosted, docker]
    defaults:
      run:
        working-directory: examples/hono-vite-react-workers-prisma
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-prisma-${{ hashFiles('examples/hono-vite-react-workers-prisma/package.json') }}
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Generate Prisma client
        run: bun run --cwd workers/db generate
      - name: Biome check
        run: bunx --bun biome check
      - name: TypeScript check
        run: bun run --filter '@app/*' typecheck
      - name: Vite build (app worker)
        run: bun run --cwd workers/app build
      - name: Run tests
        run: bun test

  # ============================================================================
  # Python (uv) examples
  # ============================================================================

  python-examples:
    name: Verify ${{ matrix.example }}
    runs-on: [self-hosted, docker]
    strategy:
      fail-fast: false
      matrix:
        example: [python, python-cuda]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uvx ruff check
      - name: Ruff format check
        run: uvx ruff format --check
      - name: mypy
        run: uv run mypy .
        # CUDA-typed extensions (torch, cupy) often lack complete stubs.
        continue-on-error: ${{ matrix.example == 'python-cuda' }}
      - name: pytest
        if: matrix.example == 'python'
        run: uv run pytest

  # ============================================================================
  # Rust
  # ============================================================================

  rust:
    name: Verify rust
    runs-on: [self-hosted, docker]
    defaults:
      run:
        working-directory: examples/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rust
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features --workspace

  # ============================================================================
  # Swift on Linux
  # ============================================================================

  swift:
    name: Verify swift
    runs-on: [self-hosted, docker]
    container:
      image: swift:6.0-noble
    defaults:
      run:
        working-directory: examples/swift
    steps:
      # Runs before checkout, so examples/swift doesn't exist yet — override
      # the working-directory default to the container root.
      - name: Install Node.js (for GHA action runtime in swift container)
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v5
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            examples/swift/.build
            ~/.swiftpm
          key: spm-linux-swift6-${{ hashFiles('examples/swift/Package.swift', 'examples/swift/Package.resolved') }}
          restore-keys: |
            spm-linux-swift6-
      - name: swift-format lint
        run: |
          if [ -d Sources ] && [ -n "$(find Sources -name '*.swift' 2>/dev/null | head -1)" ]; then
            swift-format lint --recursive --strict Sources
          fi
      - name: swift build
        run: swift build --build-tests
      - name: swift test
        run: swift test --parallel

  # swift-ios-tweak's build needs Theos + iOS SDK (~2GB); we skip that here and
  # only lint the Swift sources. The example's own workflow guards the Theos
  # steps behind a Makefile+control existence check.
  swift-ios-tweak:
    name: Verify swift-ios-tweak
    runs-on: [self-hosted, docker]
    container:
      image: swift:6.0-noble
    defaults:
      run:
        working-directory: examples/swift-ios-tweak
    steps:
      - name: Install Node.js
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v5
      - name: swift-format lint
        run: |
          if [ -d Sources ] && [ -n "$(find Sources -name '*.swift' 2>/dev/null | head -1)" ]; then
            swift-format lint --recursive --strict Sources
          fi

  # ============================================================================
  # Deployment build validation
  # ============================================================================
  # These jobs mirror what each example's deployment.yaml does, but stop short
  # of publishing. Docker examples run `docker build` without push; Workers
  # examples run `wrangler deploy --dry-run` which resolves bindings and bundles
  # the worker without hitting the Cloudflare API.

  docker-build:
    name: Docker build ${{ matrix.example }}
    runs-on: [self-hosted, docker]
    strategy:
      fail-fast: false
      matrix:
        example:
          - hono-node
          - hono-vite-react-node
          - python
          - python-cuda
          - rust
          - swift
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Lockfiles are gitignored for the python/rust templates so downstream
      # projects regenerate their own, but the Dockerfiles pin to them via
      # `uv sync --frozen` / `cargo build --locked`. Generate them here so
      # the docker build has a lockfile to consume.
      - name: Setup uv (python examples)
        if: startsWith(matrix.example, 'python')
        uses: astral-sh/setup-uv@v6
      - name: Generate uv.lock (python examples)
        if: startsWith(matrix.example, 'python')
        working-directory: examples/${{ matrix.example }}
        run: uv lock
      - name: Setup Rust toolchain (rust)
        if: matrix.example == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock (rust)
        if: matrix.example == 'rust'
        working-directory: examples/${{ matrix.example }}
        run: cargo generate-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: examples/${{ matrix.example }}
          push: false
          tags: verify/${{ matrix.example }}:local
          cache-from: type=gha,scope=${{ matrix.example }}
          cache-to: type=gha,mode=max,scope=${{ matrix.example }}

  # The docker-build job above builds each example's *production* Dockerfile;
  # nothing built the .devcontainer ones, so a devcontainer Dockerfile could
  # break without CI noticing — as happened when the swift:6.0-noble base
  # gained a default `ubuntu` account on uid 1000 and `groupadd --gid 1000`
  # started failing, and again when nvidia/cuda:*-ubuntu24.04 did the same.
  # Build every devcontainer image that creates its own user here to catch it.
  # The swift-ios-tweak images are excluded: Theos + SDKs + Ghidra take 20+
  # minutes, and those examples carry their own devcontainer-build workflow.
  devcontainer-build:
    name: Devcontainer build ${{ matrix.example }}
    runs-on: [self-hosted, docker]
    strategy:
      fail-fast: false
      matrix:
        example:
          - python-cuda
          - swift
          - swift-ios-app
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build devcontainer image (no push)
        uses: docker/build-push-action@v6
        with:
          context: examples/${{ matrix.example }}/.devcontainer
          push: false
          tags: verify/${{ matrix.example }}-devcontainer:local
          cache-from: type=gha,scope=${{ matrix.example }}-devcontainer
          cache-to: type=gha,mode=max,scope=${{ matrix.example }}-devcontainer

  wrangler-dryrun:
    name: Wrangler dry-run ${{ matrix.example }}
    runs-on: [self-hosted, docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: hono-workers
            build: ""
            command: "deploy --dry-run --outdir=dist src/index.ts"
          - example: hono-vite-react-workers
            build: "bun run build"
            command: "deploy --dry-run --outdir=dist"
          - example: vinext
            build: "bunx vinext build"
            command: "deploy --dry-run"
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.example }}-deploy-${{ hashFiles(format('examples/{0}/package.json', matrix.example)) }}
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Pre-deploy build
        if: matrix.build != ''
        run: ${{ matrix.build }}
      - name: Wrangler dry-run
        env:
          CLOUDFLARE_API_TOKEN: dry-run-not-real
          CLOUDFLARE_ACCOUNT_ID: dry-run-not-real
        run: bunx wrangler ${{ matrix.command }}

  # The Prisma monorepo needs Prisma client generated and app worker built
  # before wrangler can bundle the api / db / app workers. Verify by running
  # `wrangler deploy --dry-run` on each worker in turn.
  wrangler-dryrun-prisma:
    name: Wrangler dry-run hono-vite-react-workers-prisma
    runs-on: [self-hosted, docker]
    defaults:
      run:
        working-directory: examples/hono-vite-react-workers-prisma
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-prisma-deploy-${{ hashFiles('examples/hono-vite-react-workers-prisma/package.json') }}
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Generate Prisma client
        run: bun run --cwd workers/db generate
      - name: Build app worker
        run: bun run --cwd workers/app build
      # Each worker's wrangler.toml points at `tsconfig = "tsconfig.json"`,
      # which wrangler resolves relative to the process CWD (not the config
      # file's dir). Run each dry-run from inside its own worker directory.
      - name: Wrangler dry-run (db)
        working-directory: examples/hono-vite-react-workers-prisma/workers/db
        env:
          CLOUDFLARE_API_TOKEN: dry-run-not-real
          CLOUDFLARE_ACCOUNT_ID: dry-run-not-real
        run: bunx wrangler deploy --dry-run --outdir=dist
      - name: Wrangler dry-run (api)
        working-directory: examples/hono-vite-react-workers-prisma/workers/api
        env:
          CLOUDFLARE_API_TOKEN: dry-run-not-real
          CLOUDFLARE_ACCOUNT_ID: dry-run-not-real
        run: bunx wrangler deploy --dry-run --outdir=dist
      - name: Wrangler dry-run (app)
        working-directory: examples/hono-vite-react-workers-prisma/workers/app
        env:
          CLOUDFLARE_API_TOKEN: dry-run-not-real
          CLOUDFLARE_ACCOUNT_ID: dry-run-not-real
        run: bunx wrangler deploy --dry-run --outdir=dist
