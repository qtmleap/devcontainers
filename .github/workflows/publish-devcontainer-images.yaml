name: Publish Devcontainer Images
on:
  push:
    branches:
      - main
      - master
    paths:
      # Only rebuild when the swift-ios-tweak devcontainer definition
      # actually changes — other example Dockerfiles are thin (just a
      # base image + features) and don't warrant a hosted image.
      - "examples/swift-ios-tweak/.devcontainer/**"
      - ".github/workflows/publish-devcontainer-images.yaml"
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up upstream apt / Theos / iPhoneOS SDK / Ghidra
    # releases even without a Dockerfile bump. Monday early morning UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-devcontainer-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # swift-ios-tweak is the only example whose Dockerfile does heavy
  # network installs (Ghidra ~800MB, jadx, ipsw, kabiroberai Swift
  # toolchain ~1.5GB, iPhoneOS SDKs ~2GB, Theos + submodules). A cold
  # local build is 20-30 min; a pre-published image lets users pull
  # in ~5 min.
  # ────────────────────────────────────────────────────────────────
  swift-ios-tweak:
    name: Build & publish swift-ios-tweak
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-swift-ios-tweak
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      # devcontainers/ci reads .devcontainer/devcontainer.json (features +
      # Dockerfile) and produces the same image the local `code .` would.
      # cacheFrom on prior tag makes incremental rebuilds seconds when only
      # a downstream RUN changed.
      - name: Build & push devcontainer image
        uses: devcontainers/ci@v0.3
        with:
          subFolder: examples/swift-ios-tweak
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: latest,${{ github.sha }}
          cacheFrom: ${{ env.IMAGE_NAME }}
          push: always
          platform: linux/amd64,linux/arm64
