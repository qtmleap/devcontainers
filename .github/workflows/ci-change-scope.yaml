name: CI Change Scope

# Reusable change scope classifier. Outputs docs_only=true only when every
# changed file is provably inside the caller's narrow human-only documentation
# allowlist. Anything uncertain (API error, truncation, race, rename, delete,
# unknown event or path) yields docs_only=false so the caller runs heavy checks.
# Copy this workflow and scripts/ci-change-scope.ts together; see
# docs/development/ci-change-scope.md.
on:
  workflow_call:
    inputs:
      doc-paths:
        description: JSON array of exact documentation paths
        type: string
        default: '[]'
      doc-prefixes:
        description: JSON array of directory prefixes (trailing slash); only Markdown beneath them
        type: string
        default: '[]'
      runner:
        description: JSON runner label or array of labels
        type: string
        default: '"ubuntu-latest"'
      force-heavy:
        description: Always report docs_only=false
        type: boolean
        default: false
    outputs:
      docs_only:
        description: '"true" only when the change is documentation-only'
        value: ${{ jobs.classify.outputs.docs_only }}
      reason:
        description: Short explanation of the decision
        value: ${{ jobs.classify.outputs.reason }}

permissions:
  contents: read

jobs:
  classify:
    name: Change Scope
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-change-scope.ts
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
      - name: Transpile change scope classifier
        run: bun build scripts/ci-change-scope.ts --target=node --format=esm --outfile=scripts/.generated/ci-change-scope.mjs
      - id: scope
        uses: actions/github-script@v7
        env:
          DOC_PATHS: ${{ inputs.doc-paths }}
          DOC_PREFIXES: ${{ inputs.doc-prefixes }}
          FORCE_HEAVY: ${{ inputs.force-heavy }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const moduleUrl = pathToFileURL(process.cwd() + '/scripts/.generated/ci-change-scope.mjs')
            await (await import(moduleUrl.href)).classifyChangeScope({ github, context, core })
