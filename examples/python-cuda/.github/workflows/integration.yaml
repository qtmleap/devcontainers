name: Integration
on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install commitlint
        run: |
          bun install conventional-changelog-conventionalcommits
          bun install @commitlint/config-conventional@latest
          bun install commitlint@latest
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
      - name: Validate last commit
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ruff check
        run: uvx ruff check
      - name: Ruff format check
        run: uvx ruff format --check

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: mypy
        run: uv run mypy .
        # CUDA-typed extension types (torch, cupy) may lack complete stubs.
        continue-on-error: true

  # No pytest job: CUDA-dependent tests cannot run on standard GitHub runners.
  # Uncomment when the project has CPU-only tests worth running in CI.
  # test:
  #   name: pytest (CPU only)
