name = "hono-vite-react-workers-app"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat_v2"]

[assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[dev]
port = 8787
ip = "0.0.0.0"
local_protocol = "http"

# --- Environments ---

[env.staging]
name = "hono-vite-react-workers-app-staging"
workers_dev = true

[env.staging.assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "hono-vite-react-workers-app"
workers_dev = false

[env.production.assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[env.production.observability]
enabled = true
head_sampling_rate = 1
